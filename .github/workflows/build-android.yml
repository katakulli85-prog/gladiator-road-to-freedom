name: "2) Android APK Derle (tek container)"

on:
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.55f1
  UNITY_IMAGE: unityci/editor:ubuntu-2022.3.55f1-android-3

jobs:
  build:
    name: Lisans + APK (tek container)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Disk boslugu ac
        run: |
          echo "ONCE:"; df -h / | tail -1
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/share/miniconda /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/lib/jvm /opt/hostedtoolcache 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean >/dev/null 2>&1 || true
          echo "SONRA:"; df -h / | tail -1

      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Secret kontrolu
        env:
          U: ${{ secrets.UNITY_EMAIL }}
          P: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$U" ] || [ -z "$P" ]; then
            echo "::error::UNITY_EMAIL ve/veya UNITY_PASSWORD eksik."
            exit 1
          fi
          echo "Secretlar mevcut (degerler gizli)."

      - name: Imaji cek
        run: docker pull "$UNITY_IMAGE"

      - name: Lisans + APK derleme (tek container, canli log)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -e
          docker run --rm \
            -v "$PWD":/project -w /project \
            -e UNITY_EMAIL -e UNITY_PASSWORD \
            "$UNITY_IMAGE" bash -c '
              echo "=== 1/2: Unity Personal lisansi aliniyor ==="
              xvfb-run -ae /dev/stdout /opt/unity/Editor/Unity -batchmode -nographics -quit \
                -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
                -logFile /tmp/license.log || true
              ls -la /root/.local/share/unity3d/Unity/ 2>/dev/null || echo "UYARI: lisans dizini yok"
              echo "=== 2/2: APK derleniyor ==="
              tail -F /tmp/build.log 2>/dev/null &
              TAILPID=$!
              xvfb-run -ae /dev/stdout /opt/unity/Editor/Unity -batchmode -nographics -quit \
                -projectPath /project \
                -executeMethod BuildCommand.PerformBuild \
                -logFile /tmp/build.log
              RC=$?
              sleep 2; kill $TAILPID 2>/dev/null || true
              echo "BUILD_EXIT=$RC"
              echo "=== build.log son 25 satir ==="
              tail -n 25 /tmp/build.log 2>/dev/null || true
              exit $RC
            '

      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: gladiator-android-apk
          path: build/Android/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Ozet
        run: |
          echo "## APK hazir" >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/Android/ >> "$GITHUB_STEP_SUMMARY" || true
