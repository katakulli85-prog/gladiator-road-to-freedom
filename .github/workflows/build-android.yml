name: "2) Android APK Derle"

on:
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.55f1
  UNITY_IMAGE: unityci/editor:ubuntu-2022.3.55f1-android-3

jobs:
  build:
    name: APK derle (otomatik lisans)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Disk boslugu ac
        run: |
          echo "ONCE:"; df -h / | tail -1
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/share/miniconda /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/lib/jvm /opt/hostedtoolcache 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean >/dev/null 2>&1 || true
          echo "SONRA:"; df -h / | tail -1

      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Secret kontrolu
        env:
          U: ${{ secrets.UNITY_EMAIL }}
          P: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$U" ] || [ -z "$P" ]; then
            echo "::error::UNITY_EMAIL ve/veya UNITY_PASSWORD secret eksik."
            exit 1
          fi
          echo "Secretlar mevcut (degerler gizli)."

      - name: Unity ile derle (GameCI + hesap lisansi)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: ${{ env.UNITY_IMAGE }}
          projectPath: .
          buildName: Android
          buildsPath: build
          version: 0.1.0
          buildMethod: BuildCommand.PerformBuild
          androidExportType: androidPackage

      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: gladiator-android-apk
          path: build/Android/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Ozet
        run: |
          echo "## APK hazir" >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/Android/ >> "$GITHUB_STEP_SUMMARY" || true
