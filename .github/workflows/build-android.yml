name: "2) Android APK Derle"

on:
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.55f1
  UNITY_IMAGE: unityci/editor:ubuntu-2022.3.55f1-android-3

jobs:
  license-gate:
    name: Lisans kontrolu
    runs-on: ubuntu-latest
    outputs:
      licensed: ${{ steps.gate.outputs.licensed }}
    steps:
      - id: gate
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "licensed=no" >> "$GITHUB_OUTPUT"
            echo "UNITY_LICENSE secret yok. Once '1) Aktivasyon Dosyasi Uret' is akisini calistir (Kutu 4-6)."
          else
            echo "licensed=yes" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: APK derle
    needs: license-gate
    if: needs.license-gate.outputs.licensed == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Unity ile derle (GameCI)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: ${{ env.UNITY_IMAGE }}
          projectPath: .
          buildName: Android
          buildsPath: build
          buildVersion: 0.1.0
          buildMethod: BuildCommand.PerformBuild
          androidExportType: android-package

      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: gladiator-android-apk
          path: build/Android/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Ozet
        run: |
          echo "## APK hazir" >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/Android/ >> "$GITHUB_STEP_SUMMARY" || true
