name: "2) Android APK Derle (lisans+APK)"

on:
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.55f1
  UNITY_IMAGE: unityci/editor:ubuntu-2022.3.55f1-android-3
  IMAGE_CACHE_KEY: docker-image-android-3-v1

jobs:
  build:
    name: Personal lisans al + APK derle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: gladiator-Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            gladiator-Library-Android-

      - name: Docker imaj cache geri yukle
        uses: actions/cache/restore@v4
        id: docker-cache
        with:
          path: /tmp/unity-image.tar
          key: ${{ env.IMAGE_CACHE_KEY }}

      - name: Imaji hazirla (cache'ten yukle veya cek)
        run: |
          if [ -f /tmp/unity-image.tar ]; then
            echo "Cache'ten yukleniyor (hizli yol)..."
            LOAD_START=$(date +%s)
            docker load -i /tmp/unity-image.tar
            LOAD_END=$(date +%s)
            echo "Load suresi: $((LOAD_END - LOAD_START)) sn"
          else
            echo "Cache yok - Docker Hub'dan cekiliyor (ilk koşu veya cache doldu)..."
            PULL_START=$(date +%s)
            docker pull "$UNITY_IMAGE"
            PULL_END=$(date +%s)
            echo "Pull suresi: $((PULL_END - PULL_START)) sn"
            # Sonraki koşular icin cache'e kaydet
            echo "Cache'e kaydediliyor..."
            mkdir -p /tmp/unity-image-cache
            docker save "$UNITY_IMAGE" -o /tmp/unity-image.tar
            echo "Kaydedildi ($(du -sh /tmp/unity-image.tar | cut -f1))"
          fi

      - name: Imaj dogrulama
        run: |
          docker images | grep unityci/editor || { echo "::error::Imaj bulunamadi!"; exit 1; }
          echo "Imaj dogrulandi: $UNITY_IMAGE mevcut"

      - name: Secret kontrolu
        env:
          U: ${{ secrets.UNITY_EMAIL }}
          P: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$U" ] || [ -z "$P" ]; then
            echo "::error::Secrets eksik"
            exit 1
          fi

      - name: Personal lisans al + APK derle
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -e
          BUILD_START=$(date +%s)
          docker run --rm \
            -v "$PWD":/project -w /project \
            -e UNITY_EMAIL -e UNITY_PASSWORD \
            "$UNITY_IMAGE" bash -c '
              LC="/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client"
              echo "=== 1/3: LISANS ==="
              xvfb-run -ae /dev/stdout "$LC" --activate-all --include-personal \
                --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" || true
              echo "=== 2/3: LISANS KONTROLU ==="
              ls /root/.config/unity3d/ 2>/dev/null || true
              echo "=== 3/3: APK DERLENIYOR ==="
              xvfb-run -ae /dev/stdout /opt/unity/Editor/Unity -batchmode -nographics -quit \
                -projectPath /project \
                -executeMethod BuildCommand.PerformBuild \
                -logFile /project/build.log
              RC=$?
              echo "BUILD_EXIT=$RC"
              echo "=== HATA SATIRLARI ==="
              grep -iE "error|exception|abort|fail" /project/build.log | head -n 40 || echo "hata yok"
              echo "=== BOOTSTRAP RAPOR ==="
              grep -E "\[Bootstrap\]|\[Flow\]" /project/build.log || true
              exit $RC
            '
          BUILD_END=$(date +%s)
          echo "UNITY_SURE=$((BUILD_END - BUILD_START)) saniye" >> "$GITHUB_STEP_SUMMARY"

      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: gladiator-android-apk
          path: build/Android/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Docker imaj cache kaydet (ilk kosuda)
        if: steps.docker-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/unity-image.tar
          key: ${{ env.IMAGE_CACHE_KEY }}

      - name: Sure raporu
        run: |
          BUILD_END=$(date +%s)
          echo "## Derleme Sure Raporu" >> "$GITHUB_STEP_SUMMARY"
          echo "- UNITY_SURE: (yukarida)" >> "$GITHUB_STEP_SUMMARY"
          echo "- PULL vs LOAD: log satirlarinda" >> "$GITHUB_STEP_SUMMARY"

      - name: AndroidJNI regresyon testi
        run: |
          grep -q "com.unity.modules.androidjni" Packages/manifest.json || { echo "::error::AndroidJNI eksik - regresyon!"; exit 1; }
          grep -q "com.unity.modules.physics" Packages/manifest.json || { echo "::error::Physics eksik - regresyon!"; exit 1; }
          echo "Regresyon testleri: GECTI (androidjni + physics mevcut)"
