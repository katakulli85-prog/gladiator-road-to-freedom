name: "2) Android APK Derle (lisans+APK)"

on:
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.55f1
  UNITY_IMAGE: unityci/editor:ubuntu-2022.3.55f1-android-3

jobs:
  build:
    name: Personal lisans al + APK derle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Disk boslugu ac
        run: |
          echo "ONCE:"; df -h / | tail -1
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/share/miniconda /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/lib/jvm /opt/hostedtoolcache 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean >/dev/null 2>&1 || true
          echo "SONRA:"; df -h / | tail -1

      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Library cache (hizlandirma)
        uses: actions/cache@v4
        with:
          path: Library
          key: gladiator-Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            gladiator-Library-Android-

      - name: Secret kontrolu
        env:
          U: ${{ secrets.UNITY_EMAIL }}
          P: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$U" ] || [ -z "$P" ]; then
            echo "::error::UNITY_EMAIL ve/veya UNITY_PASSWORD eksik."
            exit 1
          fi
          echo "Secretlar mevcut (degerler gizli)."

      - name: Imaji cek
        run: docker pull "$UNITY_IMAGE"

      - name: Personal lisans al + APK derle (tek container)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -e
          docker run --rm \
            -v "$PWD":/project -w /project \
            -e UNITY_EMAIL -e UNITY_PASSWORD \
            "$UNITY_IMAGE" bash -c '
              LC="/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client"
              echo "=== 1/3: PERSONAL LISANS ALINIYOR ==="
              xvfb-run -ae /dev/stdout "$LC" --activate-all --include-personal \
                --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"
              echo "=== 2/3: LISANS KONTROLU ==="
              ls /root/.config/unity3d/ 2>/dev/null || true
              echo "=== 3/3: APK DERLENIYOR ==="
              xvfb-run -ae /dev/stdout /opt/unity/Editor/Unity -batchmode -nographics -quit \
                -projectPath /project \
                -executeMethod BuildCommand.PerformBuild \
                -logFile /project/build.log
              RC=$?
              echo "BUILD_EXIT=$RC"
              echo "=== LOGERROR CONTEXT ==="
              grep -B3 -A8 "LogError" /project/build.log | head -n 60 || echo "LogError yok"
              echo "=== HATA SATIRLARI (harf duyarsiz) ==="
              grep -iE "error|exception|abort|fail" /project/build.log | head -n 40 || echo "yok"
              echo "=== BOOTSTRAP RAPOR ==="
              grep -E "\[Bootstrap\]|\[Flow\]|\[Arena\]" /project/build.log || true
              exit $RC
            '

      - name: Tam build.log artifact (her durumda)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: gladiator-android-apk
          path: build/Android/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Ozet
        run: |
          echo "## APK hazir" >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/Android/ >> "$GITHUB_STEP_SUMMARY" || true
