name: "2) Android APK Derle (lisans+APK)"

on:
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.55f1
  UNITY_IMAGE: unityci/editor:ubuntu-2022.3.55f1-android-3

jobs:
  build:
    name: Personal lisans al + APK derle
    # ubuntu-latest 19 Ekim 2026'da Ubuntu 26'ya geciyor; surum sabitlendi.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Disk boslugu ac
        shell: bash
        run: |
          echo "ONCE:"; df -h / | tail -1
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/share/miniconda \
            /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            /usr/lib/jvm /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get clean >/dev/null 2>&1 || true
          echo "SONRA:"; df -h / | tail -1

      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: gladiator-Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            gladiator-Library-Android-

      - name: Docker imaj cache geri yukle
        uses: actions/cache/restore@v4
        with:
          path: /tmp/unity-image.tar
          key: unity-img-android3-v1

      - name: Imaji hazirla
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/unity-image.tar ]; then
            echo "Imaj cache'den yukleniyor."
            T0=$(date +%s)
            docker load -i /tmp/unity-image.tar
            T1=$(date +%s)
            echo "LOAD_SURE=$((T1-T0))" >> "$GITHUB_ENV"
            echo "YOL=cache" >> "$GITHUB_ENV"
          else
            echo "Imaj indiriliyor."
            T0=$(date +%s)
            docker pull "$UNITY_IMAGE"
            T1=$(date +%s)
            echo "PULL_SURE=$((T1-T0))" >> "$GITHUB_ENV"
            echo "YOL=pull" >> "$GITHUB_ENV"
            docker save "$UNITY_IMAGE" -o /tmp/unity-image.tar
            echo "IMAGE_SAVED=1" >> "$GITHUB_ENV"
          fi

      - name: Imaji dogrula
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "$UNITY_IMAGE" >/dev/null
          echo "Unity imaji dogrulandi."

      - name: Secret kontrolu
        shell: bash
        env:
          U: ${{ secrets.UNITY_EMAIL }}
          P: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$U" ] || [ -z "$P" ]; then
            echo "::error::UNITY_EMAIL veya UNITY_PASSWORD secret eksik."
            exit 1
          fi
          echo "Secret varligi kontrol edildi."

      - name: Proje ve BuildCommand kontrolu
        shell: bash
        run: |
          set -euo pipefail
          [ -f "ProjectSettings/ProjectVersion.txt" ] || { echo "::error::Unity projesi bulunamadi."; exit 1; }
          [ -f "Packages/manifest.json" ] || { echo "::error::manifest.json bulunamadi."; exit 1; }
          grep -R -l --include='*.cs' 'class BuildCommand' Assets >/dev/null \
            || { echo "::error::BuildCommand bulunamadi."; exit 1; }
          echo "Temel proje dosyalari kontrol edildi."

      - name: Personal lisans ve APK derleme
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build/Android
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            -e UNITY_EMAIL -e UNITY_PASSWORD \
            "$UNITY_IMAGE" \
            bash -lc '
              set -uo pipefail
              UNITY="/opt/unity/Editor/Unity"
              LC="/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client"
              echo "=== 1/3: LISANS ==="
              if [ -x "$LC" ]; then
                xvfb-run -a "$LC" --activate-all --include-personal \
                  --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" \
                  || echo "Lisans araci uyari verdi; derleme dogrulayacak."
              else
                echo "Licensing client yok; derleme dogrulayacak."
              fi
              echo "=== 2/3: APK DERLEME ==="
              set +e
              xvfb-run -a "$UNITY" -batchmode -quit \
                -projectPath /project \
                -executeMethod BuildCommand.PerformBuild \
                -logFile /project/build.log
              RC=$?
              set -e
              echo "BUILD_EXIT=$RC"
              if [ -f /project/build.log ]; then
                echo "=== DERLEME HATALARI ==="
                # Ilk anlamli hata: C# derleme, Gradle, build raporu
                grep -nE "error CS[0-9]+|Exception|BuildFailedException|Build Failed|FAILURE:|What went wrong|Gradle build failed|CommandInvokationFailure|Error building Player|\[Bootstrap\] Sonuc" /project/build.log | head -n 60 || true
                echo "=== LOG SONU (son 40 satir) ==="
                tail -n 40 /project/build.log || true
                echo "=== OYUN AKISI ==="
                grep -E "\[Bootstrap\]|\[Flow\]" /project/build.log || true
              fi
              if [ "$RC" -ne 0 ]; then
                echo "Unity derlemesi basarisiz."
                exit "$RC"
              fi
              echo "=== 3/3: APK KONTROLU ==="
              find /project/build/Android -maxdepth 1 -type f -name "*.apk" -print -quit \
                | grep -q . || { echo "HATA: APK bulunamadi."; exit 1; }
              echo "APK dosyasi bulundu."
            '

      - name: build.log icindeki e-postalari maskele
        if: failure()
        shell: bash
        env:
          E: ${{ secrets.UNITY_EMAIL }}
        run: |
          [ -f build.log ] || exit 0
          sudo chown "$(id -u)" build.log || true
          perl -pi -e 's/\Q$ENV{E}\E/***/g if length $ENV{E}; s/[\w.+-]+@[\w-]+\.[\w.-]+/***@***/g' build.log

      - name: Unity build.log yukle (hata ayiklama)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-log
          path: build.log
          retention-days: 7
          if-no-files-found: warn

      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: gladiator-android-apk
          path: build/Android/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Docker imaj cache kaydet
        if: success() && env.IMAGE_SAVED == '1'
        uses: actions/cache/save@v4
        with:
          path: /tmp/unity-image.tar
          key: unity-img-android3-v1

      - name: Sure raporu
        if: always()
        shell: bash
        run: |
          {
            echo "## Sure Raporu"
            echo "- Imaj yolu: ${YOL:-bilinmiyor}"
            echo "- Load: ${LOAD_SURE:-0} sn | Pull: ${PULL_SURE:-0} sn"
          } >> "$GITHUB_STEP_SUMMARY"
