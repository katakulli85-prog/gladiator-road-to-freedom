name: "2) Android APK Derle (lisans+APK)"

on:
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.55f1
  UNITY_IMAGE: unityci/editor:ubuntu-2022.3.55f1-android-3

jobs:
  build:
    name: Personal lisans al + APK derle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: gladiator-Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            gladiator-Library-Android-

      - name: Docker imaj cache GERI YUKLE
        id: imgcache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/unity-image.tar
          key: unity-img-android3-v1

      - name: Imaji hazirla (load veya pull)
        run: |
          if [ -f /tmp/unity-image.tar ]; then
            T0=$(date +%s)
            docker load -i /tmp/unity-image.tar
            T1=$(date +%s)
            echo "LOAD_SURE=$((T1-T0))" >> "$GITHUB_ENV"
            echo "YOL=cache" >> "$GITHUB_ENV"
          else
            T0=$(date +%s)
            docker pull "$UNITY_IMAGE"
            T1=$(date +%s)
            echo "PULL_SURE=$((T1-T0))" >> "$GITHUB_ENV"
            echo "YOL=pull" >> "$GITHUB_ENV"
            docker save "$UNITY_IMAGE" -o /tmp/unity-image.tar
            echo "IMAJ_TAR_KAYDEDILDI" >> "$GITHUB_ENV"
          fi

      - name: Imaj dogrulama
        run: docker images | grep "unityci/editor" && echo "IMAJ OK"

      - name: Secret kontrolu
        env:
          U: ${{ secrets.UNITY_EMAIL }}
          P: ${{ secrets.UNITY_PASSWORD }}
        run: |
          [ -z "$U" ] || [ -z "$P" ] && { echo "::error::Secrets eksik"; exit 1; }
          echo "Secretlar OK"

      - name: Personal lisans + APK derle
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          docker run --rm \
            -v "$PWD":/project -w /project \
            -e UNITY_EMAIL -e UNITY_PASSWORD \
            "$UNITY_IMAGE" bash -c '
              LC="/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client"
              echo "=== 1/3: LISANS ==="
              xvfb-run -ae /dev/stdout "$LC" --activate-all --include-personal \
                --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" || true
              echo "=== 3/3: APK DERLENIYOR ==="
              xvfb-run -ae /dev/stdout /opt/unity/Editor/Unity -batchmode -nographics -quit \
                -projectPath /project \
                -executeMethod BuildCommand.PerformBuild \
                -logFile /project/build.log
              RC=$?
              echo "BUILD_EXIT=$RC"
              grep -iE "error|exception|abort|fail" /project/build.log | head -n 40 || true
              grep -E "\[Bootstrap\]|\[Flow\]" /project/build.log || true
              exit $RC
            '

      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: gladiator-android-apk
          path: build/Android/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Docker imaj cache KAYDET (ilk kosuda)
        if: env.IMAJ_TAR_KAYDEDILDI == 'IMAJ_TAR_KAYDEDILDI'
        uses: actions/cache/save@v4
        with:
          path: /tmp/unity-image.tar
          key: unity-img-android3-v1

      - name: Sure raporu
        run: |
          echo "## Sure Raporu" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imaj yolu: ${{ env.YOL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Load/Pull suresi: (log satirlarinda)" >> "$GITHUB_STEP_SUMMARY"
