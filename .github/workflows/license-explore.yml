name: "3) Lisans Kesfi (Plan D)"

on:
  workflow_dispatch:

env:
  UNITY_IMAGE: unityci/editor:ubuntu-2022.3.55f1-android-3

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Disk boslugu ac
        run: |
          sudo swapoff -a || true; sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/lib/jvm /opt/hostedtoolcache 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Imaji cek
        run: docker pull "$UNITY_IMAGE"

      - name: Kesif
        env:
          U: ${{ secrets.UNITY_EMAIL }}
          P: ${{ secrets.UNITY_PASSWORD }}
        run: |
          docker run --rm -e U -e P "$UNITY_IMAGE" bash -c '
            LC="/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client"
            echo "=== A) CLIENT NEREDE ==="
            ls -la "$LC" 2>/dev/null || find /opt/unity -name "*Licensing*Client*" -type f 2>/dev/null | head -5
            echo "=== B) YARDIM (kullanilabilir komutlar) ==="
            "$LC" --help 2>&1 | head -100 || true
            echo "=== C) LOGIN DENEMESI ==="
            timeout 120 "$LC" --login --username "$U" --password "$P" 2>&1 || true
            echo "=== D) DURUM ==="
            "$LC" --status 2>&1 || true
            echo "=== E) LISANS DOSYALARI ==="
            ls -la /root/.local/share/unity3d/Unity/ 2>/dev/null || echo "dizin bos/yok"
          '
