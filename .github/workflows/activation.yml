name: "1) Aktivasyon Dosyasi Uret (.alf)"

on:
  workflow_dispatch:

env:
  UNITY_IMAGE: unityci/editor:ubuntu-2022.3.55f1-android-3

jobs:
  request-activation-file:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Disk boslugu ac
        run: |
          echo "ONCE:"; df -h / | tail -1
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/share/miniconda /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/lib/jvm /opt/hostedtoolcache 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean >/dev/null 2>&1 || true
          echo "SONRA:"; df -h / | tail -1

      - name: Imaji cek
        run: docker pull "$UNITY_IMAGE"

      - name: Ortam kontrolu (xvfb + Unity yolu)
        run: |
          docker run --rm --entrypoint bash "$UNITY_IMAGE" -c 'echo "xvfb-run -> $(command -v xvfb-run || echo YOK)"; echo "Unity -> $(test -x /opt/unity/Editor/Unity && echo VAR || echo YOK)"'

      - name: Aktivasyon dosyasi uret (canli log + 15 dk tavan)
        run: |
          set -e
          OUT="$RUNNER_TEMP/alf"
          mkdir -p "$OUT"
          rm -f "$OUT/unity.log"
          tail -F "$OUT/unity.log" &
          TAILPID=$!
          set +e
          timeout 900 docker run --rm --entrypoint bash -v "$OUT:/output" -w /output "$UNITY_IMAGE" -c 'xvfb-run -ae /dev/stdout /opt/unity/Editor/Unity -batchmode -nographics -quit -createManualActivationFile -logFile /output/unity.log; echo "UNITY_EXIT=$?"; find /root /home /github /output -maxdepth 4 -name "*.alf" 2>/dev/null'
          DOCKER_RC=$?
          set -e
          sleep 2
          kill $TAILPID 2>/dev/null || true
          echo "DOCKER_RC=$DOCKER_RC"
          echo "--- OUT icerigi ---"
          ls -la "$OUT"
          ALF=$(find "$OUT" -name "*.alf" | head -1)
          if [ -z "$ALF" ]; then
            echo "=== unity.log son 40 satir ==="
            tail -n 40 "$OUT/unity.log" 2>/dev/null || echo "unity.log hic olusmadi"
            exit 1
          fi
          echo "ALF OK: $ALF"

      - name: .alf artifact olarak yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity_ActivationFile
          path: ${{ runner.temp }}/alf/*.alf
          retention-days: 14
          if-no-files-found: ignore

      - name: Talimatlari ozete yaz
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Aktivasyon adimlari (telefondan)
          1. Artifacts bolumunden Unity_ActivationFile dosyasini indir, .alf cikar.
          2. Tarayicida license.unity3d.com/manual -> Unity hesabinla gir.
          3. Browse ile .alf dosyasini sec -> NEXT -> .ulf iner.
          4. .ulf dosyasini metin olarak ac, TUM icerigi kopyala.
          5. Depo -> Settings -> Secrets and variables -> Actions -> New repository secret
             - Name: UNITY_LICENSE
             - Secret: kopyaladigin .ulf icerigi.
          6. Sonra "2) Android APK Derle" is akisini elle calistir.
          UYARI: .ulf gizli belgedir; depoya commit ETME, kimseyle paylasma.
          SUMMARY
