name: "4) EditMode Testler (APK yok)"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  editmode:
    name: Kayit/Ayar testleri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Disk boslugu ac
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/share/miniconda /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          df -h / | tail -1

      - uses: actions/checkout@v4

      - name: Secret kontrolu
        env:
          U: ${{ secrets.UNITY_EMAIL }}
          P: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$U" ] || [ -z "$P" ]; then
            echo "::error::Secrets eksik - test calistirilamaz"
            exit 1
          fi
          echo "Secretlar OK"

      - name: Unity EditMode testleri
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          docker run --rm \
            -v "$PWD":/project -w /project \
            -e UNITY_EMAIL -e UNITY_PASSWORD \
            "unityci/editor:ubuntu-2022.3.55f1-base-3" bash -c '
              LC="/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client"
              xvfb-run -ae /dev/stdout "$LC" --activate-all --include-personal \
                --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" || true
              xvfb-run -ae /dev/stdout /opt/unity/Editor/Unity -batchmode -nographics \
                -projectPath /project \
                -runTests -testPlatform EditMode \
                -testResults /project/test-results.xml \
                -logFile /tmp/test.log
              RC=$?
              echo "TEST_EXIT=$RC"
              grep -iE "passed|failed|error" /tmp/test.log | tail -n 20 || true
              exit $RC
            '
